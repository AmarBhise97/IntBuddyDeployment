services:
  mysql:
    image: mysql:8.4
    container_name: intbuddy-mysql
    restart: unless-stopped

    env_file:
      - ../env/mysql.env

    ports:
      - "3306:3306"

    volumes:
      - ../volumes/mysql:/var/lib/mysql

    networks:
      - intbuddy-network

networks:
  intbuddy-network:
    external: true