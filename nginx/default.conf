server {

    listen 80;

    server_name _;

    client_max_body_size 20M;

    # Docker's embedded DNS. Resolving upstreams at request time (via variables)
    # lets Nginx start even if the frontend/backend containers are not up yet,
    # and picks up new container IPs after redeploys.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend_upstream intbuddy-frontend;
    set $backend_upstream  intbuddy-backend;

    location / {

        proxy_pass http://$frontend_upstream:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    location /api/ {

        # Strip the /api prefix: /api/users/login -> /users/login
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream:8080;

        proxy_http_version 1.1;

        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
