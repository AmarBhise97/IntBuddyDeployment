services:
  nginx:
    image: nginx:1.28-alpine
    container_name: intbuddy-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - intbuddy-network

networks:
  intbuddy-network:
    external: true
