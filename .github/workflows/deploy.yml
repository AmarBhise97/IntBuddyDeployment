name: Deploy Infrastructure

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Deploy MySQL Redis Nginx on EC2

      uses: appleboy/ssh-action@v1.0.3

      with:

        host: ${{ secrets.EC2_HOST }}

        username: ubuntu

        key: ${{ secrets.EC2_SSH_KEY }}


        script: |

          set -e

          echo "========== Deployment Started =========="


          if [ ! -d /opt/intbuddy/deployment/.git ]; then
            git clone https://github.com/AmarBhise97/IntBuddyDeployment.git /opt/intbuddy/deployment
          fi

          cd /opt/intbuddy/deployment


          echo "Pulling latest changes"

          # reset (not pull) so tracked files deleted on the host are restored;
          # untracked env/ and volumes/ are left untouched
          git fetch origin main

          git reset --hard origin/main



          echo "Creating Docker network"

          docker network inspect intbuddy-network >/dev/null 2>&1 || docker network create intbuddy-network



          # Stateful services: only start them if they are not already running,
          # so a deploy never recreates the database or cache
          if [ "$(docker inspect -f '{{.State.Running}}' intbuddy-mysql 2>/dev/null)" = "true" ]; then
            echo "MySQL already running - skipping"
          else
            echo "Deploying MySQL"
            docker compose -f mysql/docker-compose.mysql.yml up -d
          fi



          if [ "$(docker inspect -f '{{.State.Running}}' intbuddy-redis 2>/dev/null)" = "true" ]; then
            echo "Redis already running - skipping"
          else
            echo "Deploying Redis"
            docker compose -f redis/docker-compose.redis.yml up -d
          fi



          cd /opt/intbuddy/deployment



          echo "Deploying Nginx"

          cd nginx

          docker compose pull

          docker compose up -d --force-recreate



          echo "Checking running containers"

          docker ps



          echo "========== Deployment Completed =========="
